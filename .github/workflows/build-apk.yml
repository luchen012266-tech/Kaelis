name: Build AO3 Custom Reader APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android Project & SDK
        run: |
          # 1. If user uploaded the zip file directly to the repo, unzip it automatically
          if [ -f "ao3_reader_android_github.zip" ] && [ ! -f "settings.gradle" ]; then
            unzip -o ao3_reader_android_github.zip
          fi

          # 2. If user only created build-apk.yml in GitHub web editor without uploading folders, auto-generate project structure
          if [ ! -f "app/build.gradle" ]; then
            echo "Auto-generating Android project files..."
            mkdir -p app/src/main/java/com/custom/ao3reader app/src/main/assets

            cat << 'EOG' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AO3CustomReader"
          include ':app'
          EOG
            sed -i 's/^          //' settings.gradle

            cat << 'EOG' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOG
            sed -i 's/^          //' build.gradle

            cat << 'EOG' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOG
            sed -i 's/^          //' gradle.properties

            cat << 'EOG' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.custom.ao3reader'
              compileSdk 34
              defaultConfig {
                  applicationId "com.custom.ao3reader"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      applicationIdSuffix ".debug"
                      versionNameSuffix "-debug"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOG
            sed -i 's/^          //' app/build.gradle

            cat << 'EOG' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="AO3 专属阅读"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOG
            sed -i 's/^          //' app/src/main/AndroidManifest.xml

            echo "" | base64 -d > app/src/main/java/com/custom/ao3reader/MainActivity.java
            echo "" | base64 -d > app/src/main/assets/ao3_enhancer.js
          fi

          # 3. Accept pre-installed Android SDK licenses on ubuntu-latest
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AO3-Custom-Reader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
