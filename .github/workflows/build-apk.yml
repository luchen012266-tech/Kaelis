name: Build Kaelis AO3 Reader APK v3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Kaelis Project, Icon & Built-in Keystore
        run: |
          mkdir -p app/src/main/java/com/custom/ao3reader app/src/main/assets
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

          cat << 'EOG' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Kaelis"
          include ':app'
          EOG
          sed -i 's/^          //' settings.gradle

          cat << 'EOG' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOG
          sed -i 's/^          //' build.gradle

          cat << 'EOG' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOG
          sed -i 's/^          //' gradle.properties

          echo "" | base64 -d > app/build.gradle
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/java/com/custom/ao3reader/MainActivity.java
          echo "" | base64 -d > app/src/main/assets/ao3_enhancer.js
          echo "" | base64 -d > app/kaelis-release-key.jks

          # Write Thin Glass Kaelis Icon to all mipmap folders
          echo "" | base64 -d > /tmp/kaelis_icon.png
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp /tmp/kaelis_icon.png "app/src/main/res/$dir/ic_launcher.png"
            cp /tmp/kaelis_icon.png "app/src/main/res/$dir/ic_launcher_round.png"
          done

          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Kaelis APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Kaelis APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaelis-AO3-Reader-APK-v3
          path: app/build/outputs/apk/debug/app-debug.apk
